<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c18"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8bff"/><stop offset="1" stop-color="#3a5bff"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="18" fill="url(#bg)"/>
  <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#5b8bff" stop-opacity="0.35"/><stop offset="1" stop-color="#5b8bff" stop-opacity="0"/></radialGradient>
  <rect width="1200" height="760" rx="18" fill="url(#glow)"/>
  <!-- left copy -->
  <g font-family="Inter,sans-serif" fill="#fff">
    <rect x="80" y="120" width="150" height="34" rx="17" fill="#13203c"/><text x="104" y="143" font-size="14" fill="#9fb6ff">SECURE · DEFENCE</text>
    <text x="80" y="250" font-size="52" font-weight="700">Encrypted</text>
    <text x="80" y="312" font-size="52" font-weight="700">Field Comms</text>
    <text x="80" y="372" font-size="17" fill="#8595bf">Kotlin · Android · Vue companion</text>
    <text x="80" y="404" font-size="17" fill="#8595bf">Hardened, compliant architecture</text>
    <rect x="80" y="452" width="220" height="56" rx="12" fill="url(#acc)"/><text x="116" y="488" font-size="16" font-weight="600">Best Developer 2020</text>
  </g>
  <!-- phone device -->
  <g transform="translate(740,70)">
    <rect x="0" y="0" width="340" height="620" rx="46" fill="#0c1322" stroke="#26314f" stroke-width="3"/>
    <rect x="16" y="16" width="308" height="588" rx="34" fill="#0a1120"/>
    <rect x="120" y="30" width="100" height="22" rx="11" fill="#05080f"/>
