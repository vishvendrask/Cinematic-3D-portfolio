    <rect x="40" y="520" width="260" height="56" rx="14" fill="#101a30"/>
    <circle cx="72" cy="548" r="14" fill="#28c840"/>
    <rect x="100" y="540" width="160" height="14" rx="7" fill="#3a4a72"/>
