    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" fill="none"><path d="M60 300 L120 230 L180 270 L240 200 L290 240"/></g>
    <circle cx="180" cy="240" r="10" fill="#fff"/>
    <!-- message bubbles -->
    <rect x="40" y="356" width="190" height="40" rx="14" fill="#16223e"/>
    <rect x="110" y="408" width="190" height="40" rx="14" fill="#2a3a66"/>
    <rect x="40" y="460" width="160" height="40" rx="14" fill="#16223e"/>
