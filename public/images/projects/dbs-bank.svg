<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1c"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#5b8bff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="56" rx="18" fill="#0c1428"/>
  <circle cx="34" cy="28" r="7" fill="#ff5f57"/><circle cx="58" cy="28" r="7" fill="#febc2e"/><circle cx="82" cy="28" r="7" fill="#28c840"/>
  <text x="160" y="33" font-family="Inter,sans-serif" font-size="14" fill="#7f96c8">DBS · Wealth Dashboard</text>
  <!-- balance card -->
  <rect x="24" y="80" width="560" height="200" rx="16" fill="url(#acc)"/>
  <text x="56" y="132" font-family="Inter,sans-serif" font-size="15" fill="#dbe6ff">Total Balance</text>
  <text x="56" y="196" font-family="Inter,sans-serif" font-size="54" font-weight="700" fill="#fff">$ 18,420,556</text>
  <text x="56" y="240" font-family="Inter,sans-serif" font-size="15" fill="#dbe6ff">▲ 4.8% this quarter · 10M+ users</text>
  <!-- portfolio donut -->
  <rect x="608" y="80" width="568" height="200" rx="16" fill="#0e1830"/>
  <circle cx="710" cy="180" r="66" fill="none" stroke="#1a2746" stroke-width="20"/>
  <circle cx="710" cy="180" r="66" fill="none" stroke="url(#acc)" stroke-width="20" stroke-dasharray="280 415" stroke-linecap="round" transform="rotate(-90 710 180)"/>
  <g font-family="Inter,sans-serif" fill="#9fb3dd" font-size="14">
    <rect x="820" y="120" width="14" height="14" rx="4" fill="#2f6bff"/><text x="844" y="132">Equities 62%</text>
    <rect x="820" y="156" width="14" height="14" rx="4" fill="#7c5cff"/><text x="844" y="168">Bonds 24%</text>
    <rect x="820" y="192" width="14" height="14" rx="4" fill="#5b8bff"/><text x="844" y="204">Cash 14%</text>
  </g>
  <!-- bar chart -->
  <rect x="24" y="304" width="720" height="432" rx="16" fill="#0e1830"/>
  <g>
    <rect x="80" y="540" width="60" height="150" rx="8" fill="url(#bar)"/>
    <rect x="180" y="470" width="60" height="220" rx="8" fill="url(#bar)"/>
    <rect x="280" y="510" width="60" height="180" rx="8" fill="url(#bar)"/>
    <rect x="380" y="410" width="60" height="280" rx="8" fill="url(#bar)"/>
    <rect x="480" y="450" width="60" height="240" rx="8" fill="url(#bar)"/>
    <rect x="580" y="360" width="60" height="330" rx="8" fill="url(#bar)"/>
  </g>
  <g stroke="#16223e" stroke-width="1"><line x1="60" y1="400" x2="710" y2="400"/><line x1="60" y1="500" x2="710" y2="500"/><line x1="60" y1="600" x2="710" y2="600"/></g>
  <!-- transactions -->
  <rect x="768" y="304" width="408" height="432" rx="16" fill="#0e1830"/>
  <text x="800" y="344" font-family="Inter,sans-serif" font-size="16" fill="#fff">Recent Transactions</text>
  <g>
    <g transform="translate(0,0)"><rect x="800" y="372" width="344" height="56" rx="10" fill="#11203c"/><circle cx="832" cy="400" r="14" fill="#2f6bff"/></g>
    <g transform="translate(0,72)"><rect x="800" y="372" width="344" height="56" rx="10" fill="#11203c"/><circle cx="832" cy="400" r="14" fill="#7c5cff"/></g>
    <g transform="translate(0,144)"><rect x="800" y="372" width="344" height="56" rx="10" fill="#11203c"/><circle cx="832" cy="400" r="14" fill="#5b8bff"/></g>
    <g transform="translate(0,216)"><rect x="800" y="372" width="344" height="56" rx="10" fill="#11203c"/><circle cx="832" cy="400" r="14" fill="#2f6bff"/></g>
  </g>
</svg>
